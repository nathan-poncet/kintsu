name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: tests and lints on the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: The tag matches Cargo.toml
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} but Cargo.toml says $version"; exit 1; }

  create-release:
    name: draft the GitHub release from the changelog
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/create-gh-release-action@v1
        with:
          changelog: CHANGELOG.md
          token: ${{ secrets.GITHUB_TOKEN }}

  binaries:
    name: build ${{ matrix.target }}
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: kintsu
          target: ${{ matrix.target }}
          tar: unix
          zip: none
          token: ${{ secrets.GITHUB_TOKEN }}

  checksums:
    name: publish SHA256SUMS
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - name: Download every archive and sum them
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download "${GITHUB_REF_NAME}" --pattern 'kintsu-*.tar.gz'
          sha256sum kintsu-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
          gh release upload "${GITHUB_REF_NAME}" SHA256SUMS --clobber

  homebrew:
    name: update the Homebrew tap
    needs: checksums
    runs-on: ubuntu-latest
    env:
      # A fine-grained token with contents write on nathan-poncet/homebrew-kintsu.
      # Secrets are not readable in `if:`; the env var is.
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Render the formula from the published checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download "${GITHUB_REF_NAME}" --pattern SHA256SUMS
          python3 scripts/homebrew-formula.py --version "${GITHUB_REF_NAME}" --sums SHA256SUMS > kintsu.rb
          cat kintsu.rb
      - name: Push it to the tap
        if: env.TAP_TOKEN != ''
        run: |
          auth=$(printf 'x-access-token:%s' "$TAP_TOKEN" | base64 -w0)
          git -c "http.extraheader=AUTHORIZATION: basic ${auth}" clone --depth 1 \
            https://github.com/nathan-poncet/homebrew-kintsu.git tap
          mkdir -p tap/Formula
          cp kintsu.rb tap/Formula/kintsu.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/kintsu.rb
          if git diff --cached --quiet; then
            echo "The tap already has ${GITHUB_REF_NAME}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "🔖 kintsu ${GITHUB_REF_NAME#v}"
          git -c "http.extraheader=AUTHORIZATION: basic ${auth}" push
          echo "Formula/kintsu.rb pushed to nathan-poncet/homebrew-kintsu for ${GITHUB_REF_NAME}." >> "$GITHUB_STEP_SUMMARY"
      - name: Say why the tap was not updated
        if: env.TAP_TOKEN == ''
        run: |
          {
            echo '## Homebrew tap not updated'
            echo
            echo 'The `HOMEBREW_TAP_TOKEN` secret is not set, so the formula below was rendered but not pushed to `nathan-poncet/homebrew-kintsu`. See packaging/homebrew/README.md.'
            echo
            echo '```ruby'
            cat kintsu.rb
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
