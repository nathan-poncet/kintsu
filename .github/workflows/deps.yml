name: Dependencies

# Every Monday: known vulnerabilities fail the run. Dependabot opens the
# update pull requests for everything else.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  advisories:
    name: security advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
