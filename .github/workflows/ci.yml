name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · test · build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Architecture (Dependency Rule, pure inner rings)
        run: cargo xtask check
      - name: Release build
        run: cargo build --release --locked
      - name: Smoke test the binary
        shell: bash
        run: |
          ./target/release/kintsu --version
          ./target/release/kintsu init zsh | grep -q add-zsh-hook
          ./target/release/kintsu init bash | grep -q PROMPT_COMMAND
          ./target/release/kintsu init fish | grep -q fish_postexec
          test -z "$(./target/release/kintsu triage --status 0 --command ls 2>&1)"
          ./target/release/kintsu triage --status 127 --command 'gti status' 2>&1 | grep -q 127
      - name: Shell hooks parse
        shell: bash
        run: |
          bash -n shell/kintsu.bash
          if command -v zsh >/dev/null; then zsh -n shell/kintsu.zsh; fi
          if command -v fish >/dev/null; then fish -n shell/kintsu.fish; fi
