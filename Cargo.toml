[workspace]
resolver = "3"
members = ["apps/*", "crates/*", "tools/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/nathan-poncet/kintsu"

[workspace.dependencies]
kintsu-entities = { path = "crates/entities" }
kintsu-use-cases = { path = "crates/use_cases" }
kintsu-adapters = { path = "crates/adapters" }
thiserror = "2"

[profile.release]
lto = true
strip = true
codegen-units = 1
