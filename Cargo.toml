[package]
name = "kintsu"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "When a command fails, Kintsu offers to hand it to your AI agent, right there in the terminal. Any provider, your own key."
license = "MIT"
repository = "https://github.com/nathan-poncet/kintsu"
readme = "README.md"
keywords = ["terminal", "shell", "ai", "agent", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
thiserror = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.9", features = ["preserve_order"] }
ureq = { version = "3", features = ["json"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
