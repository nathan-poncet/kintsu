[package]
name = "kintsu"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "When a command fails, Kintsu offers to hand it to your AI agent, in the shell"
license = "MIT"
repository = "https://github.com/nathan-poncet/kintsu"
readme = "README.md"
keywords = ["terminal", "shell", "ai", "agent", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
thiserror = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1.1", features = ["preserve_order"] }
ureq = { version = "3", features = ["json"] }
libc = "0.2"
ratatui = "0.30"
crossterm = "0.29"
rusqlite = { version = "0.37", features = ["bundled"] }

[package.metadata.deb]
maintainer = "Nathan Poncet <112613712+nathan-poncet@users.noreply.github.com>"
copyright = "2026, Nathan Poncet"
license-file = ["LICENSE", "0"]
extended-description = """\
Any provider, your own key. Kintsu hooks your shell (zsh, bash, fish). After
a failed command it prints one bubble: what happened, a fix when a rule knows
one, and the words to ask your models or hand the case to your coding agent,
in your own terminal. Rules work with no configuration and nothing leaves the
machine. Add the hook yourself: eval "$(kintsu init zsh)" in ~/.zshrc,
eval "$(kintsu init bash)" in ~/.bashrc, or kintsu init fish | source in
~/.config/fish/config.fish."""
section = "utils"
priority = "optional"
revision = ""
assets = [
    ["target/release/kintsu", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/kintsu/README.md", "644"],
]

[profile.release]
lto = true
strip = true
codegen-units = 1

[dev-dependencies]
proptest = "1"
